# Loaded by byobu from $BYOBU_CONFIG_DIR/.tmux.conf
# Companion to ~/misc/dev-setup/tmux-sessions (tmux-snap / tmux-restore).
#
# The previous contents (tpm + tmux-resurrect + tmux-continuum) were removed on
# 2026-08-12; a backup sits next to this file as .tmux.conf.bak-20260812-165142.
#
# They had never once worked, and the reason is worth recording. tpm's
# _get_user_tmux_conf() reads the plugin list by scraping "@plugin" lines out of
# a file at a hardcoded path: $XDG_CONFIG_HOME/tmux/tmux.conf, else
# ~/.tmux.conf. Neither exists on this machine. byobu sources *this* file
# instead, which tpm never looks at, so tpm loaded itself (its prefix-I binding
# was present) and then found zero plugins and exited quietly. Symptoms:
# no resurrect/continuum key bindings, no continuum process, and no
# ~/.tmux/resurrect directory ever created.
#
# If you ever want tpm plugins back, the fix is one of:
#   a) use the legacy `set -g @tpm_plugins '...'` form, which tpm reads via
#      show-option instead of by scraping a file path, or
#   b) create ~/.tmux.conf containing the @plugin lines and source it here.
# Do not re-enable tmux-resurrect/continuum alongside tmux-restore: two restore
# paths racing over the same panes will double-launch agents.
#
# Note for the record: byobu on this machine runs on tmux's DEFAULT socket
# (/private/tmp/tmux-503/default), not a private one.

# --- session persistence bindings -------------------------------------------
# prefix is C-a (byobu), with F12 as prefix2.
#   C-a C-s  snapshot the current layout + agent session ids
#   C-a C-r  rebuild the layout and resume the agents
bind-key C-s run-shell 'if "$HOME/.local/bin/tmux-snap" -q; then tmux display-message "tmux-snap: layout saved"; else tmux display-message "tmux-snap: FAILED"; fi'
bind-key C-r run-shell -b '"$HOME/.local/bin/tmux-restore" >/tmp/tmux-restore.log 2>&1; tmux display-message "tmux-restore: done (/tmp/tmux-restore.log)"'

# --- optional: show the agent name on each pane border -----------------------
# Claude Code overwrites #{pane_title} with its own status line, so the stable
# label is the @cc_name option that tmux-snap/clds stamp onto the pane.
# Uncomment if you want it; it costs one line per pane.
# set -g pane-border-status top
# set -g pane-border-format ' #{pane_index}#{?@cc_name, #[bold]#{@cc_name}#[default],} '
